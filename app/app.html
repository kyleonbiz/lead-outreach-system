<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurum Outreach</title>
<style>
:root{color-scheme:light;--hdr:#16213f;--hdr-text:#fff;--hdr-dim:#aab4d4;--side:#e9eef7;--side-hover:#dbe4f3;--side-active:#cbd9f0;--bg:#f4f6fa;--card:#fff;--line:#dfe3ec;--text:#1d2433;--muted:#667085;--link:#1f5fbf;--primary:#1f5fbf;--primary-text:#fff;
--good:#1a7f4b;--good-bg:#e3f5ec;--bad:#c0392b;--bad-bg:#fdeaea;--warn:#9a6700;--warn-bg:#fff3d6;--info:#1f5fbf;--info-bg:#e4edfb;--grey-bg:#eceff4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--track:#e6eaf3;--focus:#1f5fbf;--ev-bg:#efe7fb;--ev:#6b3fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--hdr:#0c1224;--side:#161c2c;--side-hover:#1e2640;--side-active:#26335a;--bg:#0f1320;--card:#171c2b;--line:#2a3147;--text:#e8ebf5;--muted:#9aa3bb;--link:#7aa7ff;--primary:#4c7fe0;--good:#4cc38a;--good-bg:#12301f;--bad:#f07a6e;--bad-bg:#3a1b19;--warn:#e0a63a;--warn-bg:#33270c;--info:#7aa7ff;--info-bg:#1b2745;--grey-bg:#232a3d;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--track:#26304a;--focus:#7aa7ff;--ev-bg:#2a2147;--ev:#c4a8f5}}
:root[data-theme="dark"]{color-scheme:dark;--hdr:#0c1224;--side:#161c2c;--side-hover:#1e2640;--side-active:#26335a;--bg:#0f1320;--card:#171c2b;--line:#2a3147;--text:#e8ebf5;--muted:#9aa3bb;--link:#7aa7ff;--primary:#4c7fe0;--good:#4cc38a;--good-bg:#12301f;--bad:#f07a6e;--bad-bg:#3a1b19;--warn:#e0a63a;--warn-bg:#33270c;--info:#7aa7ff;--info-bg:#1b2745;--grey-bg:#232a3d;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--track:#26304a;--focus:#7aa7ff;--ev-bg:#2a2147;--ev:#c4a8f5}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}[hidden]{display:none!important}
/* shell */
#topbar{position:fixed;inset:0 0 auto 0;height:56px;background:var(--hdr);color:var(--hdr-text);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;white-space:nowrap}.logo i{width:30px;height:30px;border-radius:8px;background:#fff;color:#16213f;display:grid;place-items:center;font-style:normal;font-weight:800}
#gsearch{display:none}#gsearch input{width:100%;height:36px;border:0;border-radius:6px;padding:0 12px 0 34px;background:#fff;color:#1d2433}#gsearch svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:#667085}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}.tb-btn{background:transparent;border:0;color:var(--hdr-text);padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center}.tb-btn:hover{background:rgba(255,255,255,.1)}
.dot{width:9px;height:9px;border-radius:50%;background:#4cc38a;display:inline-block}.dot.off{background:#f07a6e}
#burger{display:none}
#side{position:fixed;top:56px;bottom:0;left:0;width:236px;background:var(--side);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;z-index:15;transition:width .15s}
#side nav{flex:1}.grp-h,.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:7px;cursor:pointer;text-align:left;color:var(--text);text-decoration:none}
.grp-h:hover,.nav-i:hover{background:var(--side-hover);text-decoration:none}.grp-h .chev{margin-left:auto;transition:transform .15s}.grp.open>.grp-h .chev{transform:rotate(180deg)}
.nav-i svg,.grp-h>svg{width:18px;height:18px;flex:none}.sub{display:none;padding:2px 0 6px 0}.grp.open .sub{display:block}.sub .nav-i{padding:7px 12px 7px 40px;color:var(--text)}
.nav-i.on{background:var(--side-active);font-weight:650}.grp-h.has-on{font-weight:650}
.org{font-size:12px;color:var(--muted);padding:10px 12px 4px;border-top:1px solid var(--line)}
body.min #side{width:60px}body.min #side .lbl,body.min #side .chev,body.min #side .sub,body.min .org{display:none}body.min #main{margin-left:60px}
#main{margin-left:236px;padding:72px 24px 48px;min-height:100%;transition:margin .15s}
.banner{padding:8px 12px;border-radius:7px;margin-bottom:12px;font-size:13px;background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
/* page chrome */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}.page-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}.page-head .sub-t{color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 14px;cursor:pointer}.btn:hover{background:var(--grey-bg)}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}.tabs a{padding:8px 2px;color:var(--text);border-bottom:3px solid transparent;white-space:nowrap}.tabs a.on{border-color:var(--primary);color:var(--link);font-weight:600}.tabs a:hover{text-decoration:none;color:var(--link)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}.card>h2{margin:0;padding:14px 18px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line)}.card .body{padding:16px 18px}.sub-note{color:var(--muted);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}.metric{padding:18px 12px;text-align:center;border-right:1px solid var(--line);display:block;color:var(--text)}.metric:last-child{border-right:0}.metric:hover{background:var(--grey-bg);text-decoration:none}
.metric b{display:block;font-size:30px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:13px}.metric small{display:block;color:var(--muted);font-size:12px}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:6px auto 0;max-width:120px}.meter i{display:block;height:100%;background:var(--primary)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}.grid2>.card{margin:0}
/* filters + table */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.field input,.field select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:170px;color:var(--text)}
.filters .links{display:flex;gap:14px;align-items:center;height:34px}.filters .right{margin-left:auto}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}.tbl-bar{display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--grey-bg);border-bottom:1px solid var(--line)}
.tr{display:grid;grid-template-columns:34px 1.1fr 1.6fr 1.4fr 1.6fr 1.3fr 28px;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:start}.tr:last-child{border-bottom:0}.tr.row:hover{background:var(--grey-bg)}
.tr .c b{display:block;font-weight:600;overflow-wrap:anywhere}.tr .c small{display:block;color:var(--muted);overflow-wrap:anywhere}.tr .c{min-width:0}
.expand{grid-column:2/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px;padding:10px 0 4px}.expand div{font-size:13px;min-width:0;overflow-wrap:anywhere}.expand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.xbtn{border:0;background:transparent;cursor:pointer;padding:2px;color:var(--muted)}.xbtn svg{width:16px;height:16px;transition:transform .15s}.xbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--grey-bg);color:var(--muted);margin-top:4px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.menu{position:relative}.menu-list{position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--line);border-radius:6px;min-width:190px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:4px}.menu-list button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:7px 10px;border-radius:4px;cursor:pointer}.menu-list button:hover{background:var(--grey-bg)}
input[type=checkbox]{width:16px;height:16px}
table.plain{border-collapse:collapse;width:100%;font-size:13px}table.plain th,table.plain td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}table.plain th{color:var(--muted);font-weight:600;font-size:12px}.num{text-align:right!important;font-variant-numeric:tabular-nums}
.draft textarea,.draft input.subj,.form input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}.draft textarea{min-height:190px;resize:vertical;margin-top:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg.ch{display:block;width:100%;height:auto;overflow:visible}svg.ch text{fill:var(--muted);font-size:11px}.scroll-x{overflow-x:auto}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card);border-radius:8px;overflow:hidden}
.cal .dow{padding:8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--grey-bg);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .cell{min-height:104px;padding:6px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cell:hover{background:var(--grey-bg)}.cal .cell.out{background:var(--bg);cursor:default;color:var(--muted)}.cal .cell.sel{outline:2px solid var(--primary);outline-offset:-2px}
.cal .num{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}.cal .today .num{background:var(--primary);color:#fff}
.chip{font-size:11px;line-height:1.3;padding:1px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;background:var(--grey-bg);color:var(--muted)}
.chip.s{background:var(--good-bg);color:var(--good)}.chip.f{background:var(--bad-bg);color:var(--bad)}.chip.u{background:var(--warn-bg);color:var(--warn)}.chip.d{background:var(--info-bg);color:var(--info)}.chip.e{background:var(--ev-bg);color:var(--ev)}
.layers{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}.layers label{display:flex;gap:6px;align-items:center;cursor:pointer}
@media (max-width:900px){.cal .cell{min-height:64px;padding:3px}.chip{font-size:10px;padding:0 3px}}
@media (max-width:600px){#topbar{gap:6px;padding:0 8px}.logo .lbl,#stxt,.lbl2{display:none}.tb-btn{padding:6px}}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--card);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:50;white-space:nowrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:9px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40}.modal{background:var(--card);border-radius:10px;padding:22px;max-width:440px;width:92%}.modal h3{margin:0 0 8px}.modal .actions{justify-content:flex-end;margin-top:16px}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
@media (max-width:900px){#burger{display:flex}#side{transform:translateX(-100%);width:250px}body.nav-open #side{transform:none;box-shadow:0 0 30px rgba(0,0,0,.35)}#main,body.min #main{margin-left:0;padding:72px 14px 40px}.tr{grid-template-columns:30px 1fr 24px}.tr .c.h{display:none}.expand{grid-column:2/-1}#gsearch{display:none}}
</style></head><body>
<div id="login" class="card" hidden><div class="body"><div class="logo" style="color:var(--text);margin-bottom:12px"><i style="background:#16213f;color:#fff">A</i> Aurum Outreach</div>
<p class="sub-note">Sign in with your service API key.</p><form id="lf" class="form"><input id="key" type="password" placeholder="API key" autocomplete="current-password" aria-label="API key"><p id="lerr" class="sub-note" style="color:var(--bad);min-height:20px"></p><button class="btn primary" style="width:100%">Sign in</button></form></div></div>
<div id="shell" hidden>
<header id="topbar"><button class="tb-btn" id="burger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="logo"><i>A</i><span class="lbl">Aurum Outreach</span></div>
<div class="tb-right"><div class="menu"><button class="tb-btn" id="usr">Kyle Fulwood ▾</button><div class="menu-list" id="usrm" hidden style="left:auto;right:0"><button data-act="theme">Toggle dark mode</button><button data-act="logout">Sign out</button></div></div></div></header>
<aside id="side"><nav id="nav" aria-label="Main"></nav><div class="org">Aurum Ventura Enterprise LLC</div><button class="nav-i" id="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6M5 5v14"/></svg><span class="lbl">Minimize</span></button></aside>
<main id="main"><div id="notices"></div><div id="view"></div></main></div>
<div id="tip"></div><div id="toast" role="status"></div><div id="modal"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key='';try{key=sessionStorage.getItem('k')||''}catch(e){}
const store=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
const IC={dash:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const NAV=[{i:'dash',t:'Dashboard',to:'/dashboard'},{i:'cal',t:'Calendar',to:'/calendar'}];
/* ---------- api ---------- */
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'x-api-key':key,'content-type':'application/json'}});
 if(r.status===403){logout('Wrong or missing API key');throw Error('auth')}
 if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw Error(d||'Request failed ('+r.status+')')}return r.json()}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
/* ---------- state + shell ---------- */
const S={info:null,dash:null,cal:null};let cur={path:'/dashboard',q:new URLSearchParams()};
const nice=k=>({contacted:'Contacted',new:'Ready to contact',not_contactable:'Not contactable',send_failed:'Failed',send_unknown:'Uncertain',sending:'In progress',replied:'Replied',unsubscribed:'Unsubscribed',invalid_email:'Invalid email',sent:'Sent',sent_test:'Test',hard_bounce:'Bounced',failed:'Failed',unknown:'Uncertain',enriched:'Email found',no_email_found:'No email found',site_unreachable:'Site unreachable',no_website:'No website',pending:'Needs review',approved:'Approved',rejected:'Rejected',skipped:'Skipped',TRUE:'Active',FALSE:'Paused'}[k]||String(k||'').replace(/_/g,' '));
function head(title,sub,actions){return `<div class="page-head"><div><h1>${esc(title)}</h1>${sub?`<div class="sub-t">${sub}</div>`:''}</div><div class="actions">${actions||''}</div></div>`}
const VIEWS={'/dashboard':[vDashboard,bDashboard],'/calendar':[vCal,bCal]};
function parseHash(){const h=(location.hash||'').slice(1);return VIEWS[h.split('?')[0]]?{path:h.split('?')[0],q:new URLSearchParams(h.split('?')[1]||'')}:null}
function go(to){cur={path:VIEWS[to]?to:'/dashboard',q:new URLSearchParams()};try{history.replaceState(null,'','#'+cur.path)}catch(e){}document.body.classList.remove('nav-open');route()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}if(!e.target.closest('.menu'))$$('.menu-list').forEach(m=>m.hidden=true)});
function nav(){$('#nav').innerHTML=NAV.map(n=>`<a class="nav-i ${n.to===cur.path?'on':''}" href="#${n.to}" data-go="${n.to}">${ico(n.i)}<span class="lbl">${n.t}</span></a>`).join('')}
$('#mini').onclick=()=>document.body.classList.toggle('min');$('#burger').onclick=()=>document.body.classList.toggle('nav-open');
$('#usr').onclick=e=>{e.stopPropagation();$('#usrm').hidden=!$('#usrm').hidden};
$('#usrm').onclick=e=>{const a=e.target.dataset.act;if(a==='logout')logout();if(a==='theme'){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'}$('#usrm').hidden=true};
function logout(msg){key='';store('k',null);S.info=S.dash=S.cal=null;$('#shell').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||''}
$('#lf').onsubmit=e=>{e.preventDefault();key=$('#key').value;store('k',key);$('#key').value='';boot()};
/* ---------- charts (inline SVG, one scale, tooltips) ---------- */
const tip=$('#tip');const showTip=(e,h)=>{tip.innerHTML=h;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=e.clientY+12+'px'};const hideTip=()=>tip.style.display='none';
const NS='http://www.w3.org/2000/svg';const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function barsChart(box,pairs,label){box.innerHTML='';if(!pairs.length){box.innerHTML='<p class="sub-note">No data yet.</p>';return}
 const W=340,rowH=26,L=124,R=40,H=pairs.length*rowH+4,max=Math.max(...pairs.map(p=>p[1]));const s=el('svg',{viewBox:`0 0 ${W} ${H}`,class:'ch',role:'img','aria-label':label});
 pairs.forEach(([k,v],i)=>{const y=i*rowH+2,w=Math.max(2,(W-L-R)*v/max);const t=el('text',{x:L-8,y:y+14,'text-anchor':'end'},s);t.textContent=nice(k).slice(0,20);t.style.fill='var(--text)';
  el('rect',{x:L,y:y+4,width:w,height:12,rx:4,fill:'var(--s1)'},s);const t2=el('text',{x:L+w+6,y:y+14},s);t2.textContent=v.toLocaleString();t2.style.fill='var(--text)';
  const hit=el('rect',{x:0,y,width:W,height:rowH,fill:'transparent'},s);hit.onmousemove=e=>showTip(e,`<b>${esc(nice(k))}</b>: ${v.toLocaleString()}`);hit.onmouseleave=hideTip});box.appendChild(s)}
function daysChart(box,data){box.innerHTML='';const ser=[['sent','Sent','--s1'],['failed','Failed','--s2'],['unknown','Uncertain','--s3']];
 const W=900,H=240,L=36,B=24,T=8,max=Math.max(5,...data.map(d=>d.sent+d.failed+d.unknown)),bw=(W-L)/data.length;const s=el('svg',{viewBox:`0 0 ${W} ${H}`,class:'ch',style:'min-width:640px',role:'img','aria-label':'Send attempts per day'});const step=Math.ceil(max/4/5)*5||5;
 for(let v=0;v<=max;v+=step){const y=T+(H-T-B)*(1-v/max);el('line',{x1:L,x2:W,y1:y,y2:y,stroke:'var(--line)'},s);const t=el('text',{x:L-6,y:y+4,'text-anchor':'end'},s);t.textContent=v}
 data.forEach((d,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;let y=H-B;ser.forEach(([k,n,c])=>{const h=(H-T-B)*d[k]/max;if(!h)return;y-=h;el('rect',{x,y,width:w,height:h,fill:`var(${c})`,stroke:'var(--card)','stroke-width':2},s)});
  if(i%5===0||i===data.length-1){const t=el('text',{x:x+w/2,y:H-6,'text-anchor':'middle'},s);t.textContent=d.date.slice(5)}
  const hit=el('rect',{x:L+i*bw,y:T,width:bw,height:H-T-B,fill:'transparent'},s);hit.onmousemove=e=>showTip(e,`<b>${d.date}</b><br>Sent ${d.sent} · Failed ${d.failed} · Uncertain ${d.unknown}`);hit.onmouseleave=hideTip});box.appendChild(s)}
/* ---------- dashboard ---------- */
function vDashboard(){const D=S.dash;if(!D)return head('Dashboard')+'<div class="empty">Loading…</div>';if(D.error)return head('Dashboard')+`<div class="banner bad">${esc(D.error)}</div>`;const k=D.kpis,a=D.attention,pct=k.daily_cap?Math.min(100,k.attempts_today/k.daily_cap*100):0;
 const br=k.bounce_rate,bt=br>=k.bounce_limit?'bad':br>=k.bounce_limit/2?'warn':'good';
 return head('Dashboard','As of '+esc(D.as_of)+' (UTC)')+
 `<div class="card"><h2>Metrics</h2><div class="metrics">
  <div class="metric"><b>${k.total_leads.toLocaleString()}</b><span>Total leads</span></div>
  <div class="metric"><b>${(D.outreach_status.find(x=>x[0]==='new')||[0,0])[1].toLocaleString()}</b><span>Ready to contact</span></div>
  <div class="metric"><b>${k.contacted.toLocaleString()}</b><span>Contacted</span></div>
  <div class="metric"><b>${(k.referral_partners||0).toLocaleString()}</b><span>Referral partners</span></div>
  <div class="metric"><b>${k.attempts_today}<small style="display:inline;font-size:15px"> / ${k.daily_cap}</small></b><span style="color:var(--text)">Sent today</span><div class="meter"><i style="width:${pct}%"></i></div></div>
  <div class="metric"><b>${br}%</b><span style="color:var(--text)">Bounce rate</span><small><span class="pill ${bt}">${bt==='good'?'Healthy':bt==='warn'?'Watch':'Over limit'} · limit ${k.bounce_limit}%</span></small></div></div></div>
 <div class="card"><h2>Needs attention</h2><div class="metrics">
  <div class="metric"><b>${a.unknown}</b><span>Uncertain delivery</span><small>${a.unknown?'Check Sent Items':'None'}</small></div>
  <div class="metric"><b>${a.pending}</b><span>Stuck in progress</span><small>${a.pending?'Review manually':'None'}</small></div>
  <div class="metric"><b>${a.failed}</b><span>Failed (not retried)</span><small>Never auto-retried</small></div></div></div>
 <div class="card"><h2>Send attempts per day</h2><div class="body"><div class="legend">${[['sent','Sent','--s1'],['failed','Failed','--s2'],['unknown','Uncertain','--s3']].map(([x,n,c])=>`<span><span class="sw" style="background:var(${c})"></span>${n} · ${D.send_totals[x].toLocaleString()} total</span>`).join('')}<span>Last 30 days · UTC</span></div><div class="scroll-x" id="ch-days"></div></div></div>
 <div class="grid2"><div class="card"><h2>Leads by status</h2><div class="body" id="ch-st"></div></div><div class="card"><h2>Email found?</h2><div class="body" id="ch-en"></div></div><div class="card"><h2>Top states</h2><div class="body" id="ch-ss"></div></div></div>`}
function bDashboard(){const D=S.dash;if(!D||D.error)return;daysChart($('#ch-days'),D.sends_by_day);barsChart($('#ch-st'),D.outreach_status,'Leads by status');barsChart($('#ch-en'),D.enrichment,'Email found');barsChart($('#ch-ss'),D.top_states,'Top states')}
/* calendar */
const CAL={month:null,sel:null,layers:{sends:true,due:true,jobs:true,events:true}};
const iso=d=>d.toISOString().slice(0,10);
function calInit(){if(!CAL.month)CAL.month=iso(new Date()).slice(0,7)}
async function loadCal(){calInit();const m=CAL.month;try{const d=await api('/api/calendar?month='+m+'&after_days='+(cur.days||5));if(CAL.month===m)S.cal=d}catch(x){if(x.message!=='auth')S.cal={error:x.message,month:m}}}
const JN=n=>n.replace(/_/g,' ');
function vCal(){calInit();const D=S.cal,[y,m]=CAL.month.split('-').map(Number),title=new Date(Date.UTC(y,m-1,1)).toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
 const nav=`<button class="btn sm" data-cm="-1" aria-label="Previous month">◀</button><button class="btn sm" data-cm="0">Today</button><button class="btn sm" data-cm="1" aria-label="Next month">▶</button><b style="min-width:150px;text-align:center">${title}</b>`;
 const hd=head('Calendar','Sends, follow-ups due, scheduled runs, and your own events. All dates are UTC.',nav+`<button class="btn primary" id="evadd">+ Add event</button>`);
 if(!D||D.month!==CAL.month)return hd+'<div class="empty">Loading…</div>';if(D.error)return hd+`<div class="banner bad">${esc(D.error)}</div>`;
 const L=CAL.layers,first=new Date(Date.UTC(y,m-1,1)),lead=first.getUTCDay(),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),rows=Math.ceil((lead+dim)/7);
 let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
 for(let i=0;i<rows*7;i++){const dn=i-lead+1;if(dn<1||dn>dim){cells+='<div class="cell out"></div>';continue}
  const k=`${CAL.month}-${String(dn).padStart(2,'0')}`,d=D.days[k]||{},ev=D.events.filter(e=>e.date===k),ch=[];
  if(L.sends){if(d.sent)ch.push(`<span class="chip s">${d.sent} sent</span>`);if(d.failed)ch.push(`<span class="chip f">${d.failed} failed</span>`);if(d.unknown)ch.push(`<span class="chip u">${d.unknown} uncertain</span>`)}
  if(L.due&&d.due_count)ch.push(`<span class="chip d">${d.due_count} follow-up${d.due_count>1?'s':''} due</span>`);
  if(L.jobs&&d.jobs){const n=Object.values(d.jobs).reduce((x,y)=>x+y,0);if(n)ch.push(`<span class="chip">${n} scheduled run${n>1?'s':''}</span>`)}
  if(L.events){ev.slice(0,2).forEach(e=>ch.push(`<span class="chip e">${esc(e.title)}</span>`));if(ev.length>2)ch.push(`<span class="chip e">+${ev.length-2} more</span>`)}
  cells+=`<button class="cell ${k===D.today?'today':''} ${k===CAL.sel?'sel':''}" data-day="${k}" aria-label="${k}"><span class="num">${dn}</span>${ch.join('')}</button>`}
 const lay=`<div class="layers">${[['sends','Emails sent'],['due','Follow-ups due'],['jobs','Scheduled runs'],['events','My events']].map(([k,t])=>`<label><input type="checkbox" data-layer="${k}" ${L[k]?'checked':''}>${t}</label>`).join('')}</div>`;
 return hd+(S.info&&S.info.local_mode?'<div class="banner">Local mode: scheduled runs shown here come from your GitHub workflows, not this app.</div>':'')+lay+`<div class="cal">${cells}</div>`+calDay(D)}
function calDay(D){const k=CAL.sel;if(!k)return '<p class="sub-note" style="margin-top:12px">Select a day to see its details.</p>';const d=D.days[k]||{},ev=D.events.filter(e=>e.date===k);
 const nice_d=new Date(k+'T00:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
 const sent=(d.sent||0)+(d.failed||0)+(d.unknown||0);
 return `<div class="card" style="margin-top:16px"><h2>${esc(nice_d)}</h2><div class="body"><div class="grid2" style="gap:24px">
  <div><b>Emails</b>${sent?`<p style="margin:6px 0">${d.sent||0} sent · ${d.failed||0} failed · ${d.unknown||0} uncertain</p>`:'<p class="sub-note">No email attempts.</p>'}</div>
  <div><b>Follow-ups due</b>${d.due_count?`<ul style="margin:6px 0;padding-left:18px">${d.due.map(x=>`<li>${esc(x.name)}</li>`).join('')}</ul>${d.due_count>d.due.length?`<p class="sub-note">…and ${d.due_count-d.due.length} more</p>`:''}`:'<p class="sub-note">None due.</p>'}</div>
  <div><b>Scheduled runs</b>${d.jobs&&Object.keys(d.jobs).length?`<ul style="margin:6px 0;padding-left:18px">${Object.entries(d.jobs).map(([n,c])=>`<li>${esc(JN(n))} ×${c}</li>`).join('')}</ul>`:'<p class="sub-note">No scheduled runs.</p>'}</div>
  <div><b>My events</b>${ev.length?`<ul style="margin:6px 0;padding-left:0;list-style:none">${ev.map(e=>`<li style="margin-bottom:8px"><span class="chip e" style="display:inline-block">${esc(e.title)}</span> <button class="btn sm" data-evdel="${esc(e.id)}">Delete</button>${e.note?`<div class="sub-note">${esc(e.note)}</div>`:''}</li>`).join('')}</ul>`:'<p class="sub-note">No events.</p>'}
   <form id="evf" class="form" style="margin-top:8px;display:grid;gap:6px"><input id="evt" maxlength="120" placeholder="Event title" aria-label="Event title" required><input id="evn" maxlength="500" placeholder="Note (optional)" aria-label="Note"><button class="btn primary sm" style="justify-self:start">Add event</button></form></div></div></div></div>`}
function bCal(){const D=S.cal;if(!D||D.error||D.month!==CAL.month)return;
 const shift=async n=>{if(n===0)CAL.month=iso(new Date()).slice(0,7);else{const [y,m]=CAL.month.split('-').map(Number),d=new Date(Date.UTC(y,m-1+n,1));CAL.month=iso(d).slice(0,7)}CAL.sel=null;S.cal=null;render(true);await loadCal();render(true)};
 $('#view').onclick=e=>{const b=e.target.closest('[data-cm],[data-day],[data-evdel]');if(!b)return;
  if(b.dataset.cm!==undefined)shift(+b.dataset.cm);
  if(b.dataset.day){CAL.sel=b.dataset.day;render(true)}
  if(b.dataset.evdel)api('/api/calendar/events/'+b.dataset.evdel,{method:'DELETE'}).then(async()=>{toast('Event deleted.');await loadCal();render(true)}).catch(x=>toast(x.message))};
 $$('[data-layer]').forEach(c=>c.onchange=()=>{CAL.layers[c.dataset.layer]=c.checked;render(true)});
 $('#evadd').onclick=()=>{if(!CAL.sel)CAL.sel=D.days&&iso(new Date()).startsWith(CAL.month)?iso(new Date()):CAL.month+'-01';render(true);const t=$('#evt');if(t){t.scrollIntoView({block:'center'});t.focus()}};
 $('#evf')&&($('#evf').onsubmit=async e=>{e.preventDefault();try{await post('/api/calendar/events',{date:CAL.sel,title:$('#evt').value,note:$('#evn').value});toast('Event added.');await loadCal();render(true)}catch(x){toast(x.message)}})}
/* ---------- render / data ---------- */
function typing(){const a=document.activeElement;return a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&$('#view').contains(a)}
function render(force){if(!VIEWS[cur.path])cur.path='/dashboard';if(!force&&typing())return;const v=VIEWS[cur.path];nav();$('#view').onclick=null;$('#view').innerHTML=v[0]();v[1]();
 $('#notices').innerHTML=S.info&&S.info.local_mode?'<div class="banner">Local mode: read-only. Reading your local spreadsheet.</div>':''}
async function ensure(){try{if(cur.path==='/dashboard'&&!S.dash)S.dash=await api('/api/dashboard');else if(cur.path==='/calendar'&&(!S.cal||S.cal.month!==CAL.month))await loadCal()}catch(x){if(x.message!=='auth'&&cur.path==='/dashboard')S.dash={error:x.message}}}
async function route(){render();await ensure();render()}
async function boot(){if(!key){$('#login').hidden=false;$('#shell').hidden=true;return}try{S.info=await api('/api/info')}catch(x){return}
 $('#login').hidden=true;$('#shell').hidden=false;const h=parseHash();if(h)cur=h;await route();
 clearInterval(boot.t);boot.t=setInterval(async()=>{if(!key)return;try{if(cur.path==='/dashboard')S.dash=await api('/api/dashboard');else await loadCal();render()}catch(e){}},30000)}
boot();
</script></body></html>
