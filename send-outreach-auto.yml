name: Send Outreach (Auto)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: read
  id-token: write
jobs:
  send-outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - name: Discord start notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d '{"content": "📧 Sending 10 emails"}' "$DISCORD_WEBHOOK_URL"
      - name: Send emails
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          TEST_MODE: 'false'
          PER_RUN_CAP: '10'
          DAILY_CAP: '100'
        run: python send_emails.py
      - name: Discord completion notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d '{"content": "✅ Batch sent"}' "$DISCORD_WEBHOOK_URL"
