name: Send Test Email
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send the test email to this address'
        required: true
        default: 'admin@aurumventura.net'
permissions:
  contents: read
  id-token: write
jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - name: Discord start notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🧪 Test email starting → ${{ inputs.test_email }}\"}" "$DISCORD_WEBHOOK_URL"
      - name: Send one test email
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          TEST_MODE: 'true'
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python send_emails.py
      - name: Discord completion notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"✅ Test email sent to ${{ inputs.test_email }}\"}" "$DISCORD_WEBHOOK_URL"
