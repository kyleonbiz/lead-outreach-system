name: Find Leads

on:
  workflow_dispatch:
    inputs:
      industry:
        description: 'Industry to search for (leave blank to use the rotation queue)'
        required: false
        default: ''
      location:
        description: 'Location to search in (leave blank to use the rotation queue)'
        required: false
        default: ''
  schedule:
    - cron: '0 12-21 * * 1-5'

permissions:
  contents: read
  id-token: write

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Pick next campaign
        id: campaign
        if: ${{ inputs.industry == '' || inputs.location == '' }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python pick_next_campaign.py

      - name: Set campaign variables
        id: vars
        run: |
          if [ -n "${{ inputs.industry }}" ] && [ -n "${{ inputs.location }}" ]; then
            echo "industry=${{ inputs.industry }}" >> "$GITHUB_OUTPUT"
            echo "location=${{ inputs.location }}" >> "$GITHUB_OUTPUT"
          else
            echo "industry=${{ steps.campaign.outputs.industry }}" >> "$GITHUB_OUTPUT"
            echo "location=${{ steps.campaign.outputs.location }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord (starting)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🔍 Starting lead search: **${{ steps.vars.outputs.industry }}** in **${{ steps.vars.outputs.location }}**\"}" "$DISCORD_WEBHOOK_URL"

      - name: Run lead discovery
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          MAX_RESULTS_PER_RUN: '3'
        run: python find_leads.py "${{ steps.vars.outputs.industry }}" "${{ steps.vars.outputs.location }}"

      - name: Run enrichment
        run: python enrich_leads.py

      - name: Write leads to Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python write_to_sheets.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: leads-enriched
          path: leads_enriched.json

      - name: Notify Discord (finished)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"✅ Finished: **${{ steps.vars.outputs.industry }}** in **${{ steps.vars.outputs.location }}** — check the Leads sheet for results.\"}" "$DISCORD_WEBHOOK_URL"
