name: Find Leads

on:
  workflow_dispatch:
    inputs:
      industry:
        description: 'Industry to search for'
        required: true
        default: 'coffee shops'
      location:
        description: 'Location to search in'
        required: true
        default: 'Nashville, TN'

permissions:
  contents: read
  id-token: write

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run lead discovery
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python find_leads.py "${{ inputs.industry }}" "${{ inputs.location }}"

      - name: Run enrichment
        run: python enrich_leads.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Write leads to Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python write_to_sheets.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: leads-enriched
          path: leads_enriched.json
