name: Find Leads
on:
  workflow_dispatch:
    inputs:
      industry:
        description: 'Industry to search for (leave blank to use the rotation queue)'
        required: false
        default: ''
      location:
        description: 'Location to search in (leave blank to use the rotation queue)'
        required: false
        default: ''
  schedule:
    - cron: '0 14 * * 1-5'
permissions:
  contents: read
  id-token: write
jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - name: Pick next campaign
        id: campaign
        if: ${{ inputs.industry == '' || inputs.location == '' }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python pick_next_campaign.py
      - name: Set campaign variables
        id: vars
        run: |
          if [ -n "${{ inputs.industry }}" ] && [ -n "${{ inputs.location }}" ]; then
            echo "industry=${{ inputs.industry }}" >> "$GITHUB_OUTPUT"
            echo "location=${{ inputs.location }}" >> "$GITHUB_OUTPUT"
          else
            echo "industry=${{ steps.campaign.outputs.industry }}" >> "$GITHUB_OUTPUT"
            echo "location=${{ steps.campaign.outputs.location }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Discord start notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🔍 Daily lead pull starting: **${{ steps.vars.outputs.industry }}** in **${{ steps.vars.outputs.location }}**\"}" "$DISCORD_WEBHOOK_URL"
      - name: Find leads
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          MAX_RESULTS_PER_RUN: '300'
        run: python find_leads.py "${{ steps.vars.outputs.industry }}" "${{ steps.vars.outputs.location }}"
      - run: python enrich_leads.py
      - name: Write to sheets
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python write_to_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: leads-enriched
          path: leads_enriched.json
      - name: Discord completion notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"✅ Daily pull complete: 300 leads found. Send Outreach will run at 4pm UTC.\"}" "$DISCORD_WEBHOOK_URL"
