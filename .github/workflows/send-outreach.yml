name: Send Outreach

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (true = send 1 test email only, false = live send to real leads)'
        required: true
        default: 'true'
      test_email:
        description: 'Email to receive the test send (required when test_mode is true)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  send-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Send outreach emails
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python send_emails.py
