name: Find Leads
on:
  schedule:
    - cron: '*/1 * * * *'
permissions:
  contents: read
  id-token: write
jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Test run - workflow is working
        run: echo "✅ Scheduled workflow fired successfully at $(date)"
