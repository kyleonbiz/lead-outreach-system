name: Send Outreach (Auto)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 16-23 * * 1-5'
    - cron: '0 0-2 * * 2-6'
permissions:
  contents: read
  id-token: write
# Only one sending job at a time, across scheduled and manual runs. Queued runs wait; they are not cancelled mid-send.
concurrency:
  group: outreach-sending
  cancel-in-progress: false
jobs:
  send-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - name: Send emails
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          TEST_MODE: 'false'
          # Repository variables (Settings > Secrets and variables > Actions > Variables)
          DAILY_SEND_CAP: ${{ vars.DAILY_SEND_CAP }}
          PER_RUN_CAP: ${{ vars.PER_RUN_CAP }}
          CAMPAIGN_ID: ${{ vars.CAMPAIGN_ID }}
          EMAIL_SENDING_ENABLED: ${{ vars.EMAIL_SENDING_ENABLED || 'true' }}
        run: |
          set -o pipefail
          python send_emails.py | tee send_output.txt
      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SENT=$(grep -oE 'Sent [0-9]+' send_output.txt 2>/dev/null | grep -oE '[0-9]+' || echo "0")
          RAMP=$(grep -oE 'Ramp day [0-9]+: today.s cap is [0-9]+' send_output.txt 2>/dev/null | sed -E 's/Ramp day ([0-9]+): today.s cap is ([0-9]+)/ramp day \1, cap \2\/day/' || echo "")
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="✅ Sent ${SENT} emails (${RAMP})"
          else
            MSG="❌ Email send failed (status: ${JOB_STATUS}). Check GitHub Actions logs."
          fi
          curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"${MSG}\"}" "$DISCORD_WEBHOOK_URL"
